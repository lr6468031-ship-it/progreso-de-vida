name: Build Progreso de Vida Android

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: progreso-de-vida-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  startup-smoke:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Start app and verify it stays alive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :app:installDebug
            adb logcat -c
            adb shell am start -W -n com.progresodevida/.MainActivity
            sleep 3
            PID=$(adb shell pidof com.progresodevida | tr -d '\r')
            if [ -z "$PID" ]; then
              echo "La aplicación se cerró durante el arranque"
              adb logcat -d -t 300
              exit 1
            fi
            if adb logcat -d -t 300 | grep -q "FATAL EXCEPTION.*com.progresodevida"; then
              echo "Se detectó un crash de Progreso de Vida"
              adb logcat -d -t 300
              exit 1
            fi
            echo "Progreso de Vida continúa ejecutándose con PID $PID"
